name: Build PercentCalc

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Write source files
        run: |
          mkdir -p app/Resources
          cat > 'app/AppDelegate.h' <<'__EOF__'
          #import <UIKit/UIKit.h>

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (nonatomic, strong) UIWindow *window;
          @end
          __EOF__
          cat > 'app/AppDelegate.m' <<'__EOF__'
          #import "AppDelegate.h"
          #import "PercentViewController.h"

          @implementation AppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              self.window.overrideUserInterfaceStyle = UIUserInterfaceStyleDark;
              self.window.rootViewController = [[PercentViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }

          @end
          __EOF__
          cat > 'app/Makefile' <<'__EOF__'
          TARGET := iphone:clang:latest:14.0
          ARCHS = arm64
          INSTALL_TARGET_PROCESSES = PercentCalc

          include $(THEOS)/makefiles/common.mk

          APPLICATION_NAME = PercentCalc

          PercentCalc_FILES = main.m AppDelegate.m PercentViewController.m
          PercentCalc_FRAMEWORKS = UIKit
          PercentCalc_CFLAGS = -fobjc-arc -Wno-deprecated-declarations -Wno-error

          include $(THEOS_MAKE_PATH)/application.mk
          __EOF__
          cat > 'app/PercentViewController.h' <<'__EOF__'
          #import <UIKit/UIKit.h>

          @interface PercentViewController : UIViewController
          @end
          __EOF__
          cat > 'app/PercentViewController.m' <<'__EOF__'
          #import "PercentViewController.h"

          // 입력 칸
          typedef NS_ENUM(NSInteger, PCField) {
              PCFieldBase = 0,     // 기준값 (예: 100)
              PCFieldPercent = 1,  // 퍼센트 (예: 30)
              PCFieldResult = 2,   // 결과/목표값 (예: 130)
          };

          #define PC_ORANGE [UIColor colorWithRed:1.0 green:0.62 blue:0.04 alpha:1.0]
          #define PC_DARK   [UIColor colorWithWhite:0.20 alpha:1.0]
          #define PC_LIGHT  [UIColor colorWithWhite:0.65 alpha:1.0]
          #define PC_BOX    [UIColor colorWithWhite:0.11 alpha:1.0]

          static const NSUInteger kMaxLength = 12;

          @interface PercentViewController ()
          // 상태
          @property (nonatomic, strong) NSMutableString *baseText;
          @property (nonatomic, strong) NSMutableString *percentText;
          @property (nonatomic, strong) NSMutableString *resultText;
          @property (nonatomic, assign) BOOL negative;      // NO = +, YES = −
          @property (nonatomic, assign) BOOL reverseMode;   // YES면 결과값을 입력하고 %를 계산
          @property (nonatomic, assign) PCField active;
          @property (nonatomic, assign) double computedPercent; // reverse 모드 계산값 (절댓값)
          @property (nonatomic, assign) double computedResult;  // forward 모드 계산값
          @property (nonatomic, assign) BOOL hasComputed;

          // 화면
          @property (nonatomic, strong) NSArray<UIView *> *boxes;
          @property (nonatomic, strong) NSArray<UILabel *> *captions;
          @property (nonatomic, strong) NSArray<UILabel *> *values;
          @property (nonatomic, strong) UIButton *signButton;
          @property (nonatomic, strong) UILabel *hintLabel;
          @property (nonatomic, strong) UIButton *plusKey;
          @property (nonatomic, strong) UIButton *minusKey;
          @property (nonatomic, strong) UIImpactFeedbackGenerator *haptic;
          @property (nonatomic, strong) NSNumberFormatter *displayFormatter;
          @property (nonatomic, strong) NSNumberFormatter *rawFormatter;
          @end

          @implementation PercentViewController

          - (UIStatusBarStyle)preferredStatusBarStyle { return UIStatusBarStyleLightContent; }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = UIColor.blackColor;
              self.haptic = [[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleLight];

              self.displayFormatter = [[NSNumberFormatter alloc] init];
              self.displayFormatter.numberStyle = NSNumberFormatterDecimalStyle;
              self.displayFormatter.maximumFractionDigits = 2;
              self.displayFormatter.locale = [NSLocale localeWithLocaleIdentifier:@"ko_KR"];

              self.rawFormatter = [[NSNumberFormatter alloc] init];
              self.rawFormatter.numberStyle = NSNumberFormatterDecimalStyle;
              self.rawFormatter.usesGroupingSeparator = NO;
              self.rawFormatter.maximumFractionDigits = 4;
              self.rawFormatter.locale = [NSLocale localeWithLocaleIdentifier:@"en_US_POSIX"];

              self.baseText = [NSMutableString string];
              self.percentText = [NSMutableString string];
              self.resultText = [NSMutableString string];
              self.active = PCFieldBase;

              UIView *display = [self buildDisplay];
              UIView *keypad = [self buildKeypad];
              [self.view addSubview:display];
              [self.view addSubview:keypad];

              UILayoutGuide *safe = self.view.safeAreaLayoutGuide;
              [NSLayoutConstraint activateConstraints:@[
                  [keypad.leadingAnchor constraintEqualToAnchor:safe.leadingAnchor constant:16],
                  [keypad.trailingAnchor constraintEqualToAnchor:safe.trailingAnchor constant:-16],
                  [keypad.bottomAnchor constraintEqualToAnchor:safe.bottomAnchor constant:-8],
                  [keypad.heightAnchor constraintEqualToAnchor:keypad.widthAnchor multiplier:1.12],

                  [display.leadingAnchor constraintEqualToAnchor:safe.leadingAnchor constant:16],
                  [display.trailingAnchor constraintEqualToAnchor:safe.trailingAnchor constant:-16],
                  [display.bottomAnchor constraintEqualToAnchor:keypad.topAnchor constant:-16],
                  [display.topAnchor constraintGreaterThanOrEqualToAnchor:safe.topAnchor constant:8],
              ]];

              [self refresh];
          }

          #pragma mark - 화면 구성

          - (UIView *)makeBoxWithCaption:(NSString *)caption field:(PCField)field
                                 caption:(UILabel **)captionOut value:(UILabel **)valueOut {
              UIView *box = [[UIView alloc] init];
              box.translatesAutoresizingMaskIntoConstraints = NO;
              box.backgroundColor = PC_BOX;
              box.layer.cornerRadius = 16;
              box.layer.borderWidth = 2;
              box.tag = field;
              [box addGestureRecognizer:[[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(boxTapped:)]];

              UILabel *cap = [[UILabel alloc] init];
              cap.translatesAutoresizingMaskIntoConstraints = NO;
              cap.text = caption;
              cap.font = [UIFont systemFontOfSize:13 weight:UIFontWeightMedium];
              cap.textColor = PC_LIGHT;
              [box addSubview:cap];

              UILabel *val = [[UILabel alloc] init];
              val.translatesAutoresizingMaskIntoConstraints = NO;
              val.font = [UIFont monospacedDigitSystemFontOfSize:40 weight:UIFontWeightLight];
              val.textColor = UIColor.whiteColor;
              val.textAlignment = NSTextAlignmentRight;
              val.adjustsFontSizeToFitWidth = YES;
              val.minimumScaleFactor = 0.4;
              [box addSubview:val];

              [NSLayoutConstraint activateConstraints:@[
                  [box.heightAnchor constraintEqualToConstant:70],
                  [cap.topAnchor constraintEqualToAnchor:box.topAnchor constant:8],
                  [cap.leadingAnchor constraintEqualToAnchor:box.leadingAnchor constant:14],
                  [val.leadingAnchor constraintEqualToAnchor:box.leadingAnchor constant:14],
                  [val.trailingAnchor constraintEqualToAnchor:box.trailingAnchor constant:-14],
                  [val.bottomAnchor constraintEqualToAnchor:box.bottomAnchor constant:-6],
              ]];
              *captionOut = cap;
              *valueOut = val;
              return box;
          }

          - (UIView *)buildDisplay {
              UILabel *c0, *c1, *c2, *v0, *v1, *v2;
              UIView *baseBox = [self makeBoxWithCaption:@"기준값" field:PCFieldBase caption:&c0 value:&v0];
              UIView *pctBox = [self makeBoxWithCaption:@"퍼센트" field:PCFieldPercent caption:&c1 value:&v1];
              UIView *resBox = [self makeBoxWithCaption:@"결과" field:PCFieldResult caption:&c2 value:&v2];
              v2.font = [UIFont monospacedDigitSystemFontOfSize:44 weight:UIFontWeightSemibold];
              self.boxes = @[baseBox, pctBox, resBox];
              self.captions = @[c0, c1, c2];
              self.values = @[v0, v1, v2];

              // + / − 표시 (눌러서 바꾸기)
              self.signButton = [UIButton buttonWithType:UIButtonTypeCustom];
              self.signButton.translatesAutoresizingMaskIntoConstraints = NO;
              self.signButton.titleLabel.font = [UIFont systemFontOfSize:34 weight:UIFontWeightMedium];
              self.signButton.layer.cornerRadius = 16;
              [self.signButton addTarget:self action:@selector(signTapped) forControlEvents:UIControlEventTouchUpInside];

              UIStackView *pctRow = [[UIStackView alloc] initWithArrangedSubviews:@[self.signButton, pctBox]];
              pctRow.spacing = 10;
              [self.signButton.widthAnchor constraintEqualToConstant:64].active = YES;

              UILabel *eq = [[UILabel alloc] init];
              eq.text = @"=";
              eq.font = [UIFont systemFontOfSize:34 weight:UIFontWeightMedium];
              eq.textColor = PC_LIGHT;
              eq.textAlignment = NSTextAlignmentCenter;
              UIStackView *resRow = [[UIStackView alloc] initWithArrangedSubviews:@[eq, resBox]];
              resRow.spacing = 10;
              [eq.widthAnchor constraintEqualToConstant:64].active = YES;

              self.hintLabel = [[UILabel alloc] init];
              self.hintLabel.font = [UIFont systemFontOfSize:15];
              self.hintLabel.textColor = PC_LIGHT;
              self.hintLabel.textAlignment = NSTextAlignmentCenter;
              self.hintLabel.numberOfLines = 2;
              self.hintLabel.adjustsFontSizeToFitWidth = YES;
              self.hintLabel.minimumScaleFactor = 0.7;

              UIStackView *stack = [[UIStackView alloc] initWithArrangedSubviews:@[baseBox, pctRow, resRow, self.hintLabel]];
              stack.axis = UILayoutConstraintAxisVertical;
              stack.spacing = 10;
              stack.translatesAutoresizingMaskIntoConstraints = NO;
              [stack setCustomSpacing:14 afterView:resRow];
              return stack;
          }

          - (UIButton *)keyWithTitle:(NSString *)title bg:(UIColor *)bg fg:(UIColor *)fg action:(SEL)action {
              UIButton *b = [UIButton buttonWithType:UIButtonTypeSystem];
              [b setTitle:title forState:UIControlStateNormal];
              [b setTitleColor:fg forState:UIControlStateNormal];
              b.tintColor = fg;
              b.backgroundColor = bg;
              b.titleLabel.font = [UIFont systemFontOfSize:32 weight:UIFontWeightMedium];
              b.layer.cornerRadius = 22;
              [b addTarget:self action:action forControlEvents:UIControlEventTouchUpInside];
              return b;
          }

          - (UIStackView *)rowWith:(NSArray<UIView *> *)views {
              UIStackView *row = [[UIStackView alloc] initWithArrangedSubviews:views];
              row.spacing = 12;
              row.distribution = UIStackViewDistributionFillEqually;
              return row;
          }

          - (UIView *)buildKeypad {
              // 1행: ⇄  +  −  ⌫
              UIButton *swap = [self keyWithTitle:@"⇄" bg:PC_LIGHT fg:UIColor.blackColor action:@selector(swapTapped)];
              self.plusKey = [self keyWithTitle:@"+" bg:PC_ORANGE fg:UIColor.whiteColor action:@selector(plusTapped)];
              self.minusKey = [self keyWithTitle:@"−" bg:PC_ORANGE fg:UIColor.whiteColor action:@selector(minusTapped)];
              UIButton *back = [self keyWithTitle:nil bg:PC_LIGHT fg:UIColor.blackColor action:@selector(backTapped)];
              [back setImage:[UIImage systemImageNamed:@"delete.left"
                                     withConfiguration:[UIImageSymbolConfiguration configurationWithPointSize:24 weight:UIImageSymbolWeightMedium]]
                    forState:UIControlStateNormal];
              UILongPressGestureRecognizer *lp = [[UILongPressGestureRecognizer alloc] initWithTarget:self action:@selector(backLongPressed:)];
              [back addGestureRecognizer:lp];
              UIStackView *top = [self rowWith:@[swap, self.plusKey, self.minusKey, back]];

              // 숫자
              NSMutableArray *digitRows = [NSMutableArray array];
              UIButton *seven = nil;
              for (NSArray *r in @[@[@"7", @"8", @"9"], @[@"4", @"5", @"6"], @[@"1", @"2", @"3"]]) {
                  NSMutableArray *btns = [NSMutableArray array];
                  for (NSString *d in r) {
                      UIButton *b = [self keyWithTitle:d bg:PC_DARK fg:UIColor.whiteColor action:@selector(digitTapped:)];
                      if ([d isEqualToString:@"7"]) seven = b;
                      [btns addObject:b];
                  }
                  [digitRows addObject:[self rowWith:btns]];
              }
              UIButton *zero = [self keyWithTitle:@"0" bg:PC_DARK fg:UIColor.whiteColor action:@selector(digitTapped:)];
              UIButton *dot = [self keyWithTitle:@"." bg:PC_DARK fg:UIColor.whiteColor action:@selector(digitTapped:)];
              UIStackView *last = [[UIStackView alloc] initWithArrangedSubviews:@[zero, dot]];
              last.spacing = 12;
              [digitRows addObject:last];

              UIStackView *digits = [[UIStackView alloc] initWithArrangedSubviews:digitRows];
              digits.axis = UILayoutConstraintAxisVertical;
              digits.spacing = 12;
              digits.distribution = UIStackViewDistributionFillEqually;

              UIButton *equals = [self keyWithTitle:@"=" bg:PC_ORANGE fg:UIColor.whiteColor action:@selector(equalsTapped)];
              UIStackView *lower = [[UIStackView alloc] initWithArrangedSubviews:@[digits, equals]];
              lower.spacing = 12;

              UIStackView *pad = [[UIStackView alloc] initWithArrangedSubviews:@[top, lower]];
              pad.axis = UILayoutConstraintAxisVertical;
              pad.spacing = 12;
              pad.translatesAutoresizingMaskIntoConstraints = NO;

              [NSLayoutConstraint activateConstraints:@[
                  [dot.widthAnchor constraintEqualToAnchor:seven.widthAnchor],
                  [equals.widthAnchor constraintEqualToAnchor:seven.widthAnchor],
                  [top.heightAnchor constraintEqualToAnchor:last.heightAnchor],
              ]];
              return pad;
          }

          #pragma mark - 숫자 변환

          - (NSMutableString *)textFor:(PCField)f {
              if (f == PCFieldBase) return self.baseText;
              if (f == PCFieldPercent) return self.percentText;
              return self.resultText;
          }

          - (BOOL)hasValue:(NSString *)s {
              return s.length > 0 && ![s isEqualToString:@"."];
          }

          - (NSString *)rawString:(double)v {
              return [self.rawFormatter stringFromNumber:@(v)] ?: @"";
          }

          // 입력 중인 글자를 1,234.5 처럼 보기 좋게
          - (NSString *)prettyInput:(NSString *)s {
              if (!s.length) return @"0";
              NSRange dot = [s rangeOfString:@"."];
              NSString *intPart = dot.location == NSNotFound ? s : [s substringToIndex:dot.location];
              NSString *rest = dot.location == NSNotFound ? @"" : [s substringFromIndex:dot.location];
              NSNumberFormatter *f = [[NSNumberFormatter alloc] init];
              f.numberStyle = NSNumberFormatterDecimalStyle;
              f.maximumFractionDigits = 0;
              NSString *grouped = [f stringFromNumber:@(intPart.length ? intPart.longLongValue : 0)];
              return [grouped stringByAppendingString:rest];
          }

          - (NSString *)pretty:(double)v {
              return [self.displayFormatter stringFromNumber:@(v)] ?: @"";
          }

          #pragma mark - 계산

          - (void)compute {
              self.hasComputed = NO;
              if (![self hasValue:self.baseText]) return;
              double base = self.baseText.doubleValue;

              if (!self.reverseMode) {
                  if (![self hasValue:self.percentText]) return;
                  double p = self.percentText.doubleValue * (self.negative ? -1 : 1);
                  self.computedResult = base * (1.0 + p / 100.0);
                  self.hasComputed = YES;
              } else {
                  if (![self hasValue:self.resultText] || base == 0) return;
                  double target = self.resultText.doubleValue;
                  double p = (target / base - 1.0) * 100.0;
                  self.negative = (p < 0);
                  self.computedPercent = fabs(p);
                  self.hasComputed = YES;
              }
          }

          - (void)refresh {
              [self compute];
              PCField computedField = self.reverseMode ? PCFieldPercent : PCFieldResult;

              for (NSInteger i = 0; i < 3; i++) {
                  UIView *box = self.boxes[(NSUInteger)i];
                  UILabel *val = self.values[(NSUInteger)i];
                  BOOL isComputed = (i == computedField);
                  box.layer.borderColor = (i == self.active && !isComputed) ? PC_ORANGE.CGColor : UIColor.clearColor.CGColor;

                  NSString *text;
                  if (isComputed) {
                      text = self.hasComputed ? [self pretty:(self.reverseMode ? self.computedPercent : self.computedResult)] : @"—";
                      val.textColor = PC_ORANGE;
                  } else {
                      NSString *t = [self textFor:i];
                      text = [self prettyInput:t];
                      val.textColor = t.length ? UIColor.whiteColor : [UIColor colorWithWhite:0.35 alpha:1.0];
                  }
                  if (i == PCFieldPercent) text = [text stringByAppendingString:@" %"];
                  val.text = text;
              }

              self.captions[1].text = self.reverseMode ? @"필요한 퍼센트" : @"퍼센트";
              self.captions[2].text = self.reverseMode ? @"목표값" : @"결과";

              // + / − 표시
              NSString *sign = self.negative ? @"−" : @"+";
              [self.signButton setTitle:sign forState:UIControlStateNormal];
              self.signButton.backgroundColor = self.reverseMode ? PC_BOX : PC_ORANGE;
              [self.signButton setTitleColor:(self.reverseMode ? PC_ORANGE : UIColor.whiteColor) forState:UIControlStateNormal];

              // 선택된 부호 키 강조
              BOOL showSign = !self.reverseMode;
              [self styleOpKey:self.plusKey selected:(showSign && !self.negative)];
              [self styleOpKey:self.minusKey selected:(showSign && self.negative)];

              self.hintLabel.text = [self hintText];
          }

          - (void)styleOpKey:(UIButton *)b selected:(BOOL)selected {
              b.backgroundColor = selected ? UIColor.whiteColor : PC_ORANGE;
              [b setTitleColor:(selected ? PC_ORANGE : UIColor.whiteColor) forState:UIControlStateNormal];
          }

          - (NSString *)hintText {
              if (!self.hasComputed) {
                  return self.reverseMode ? @"기준값과 목표값을 넣으면 필요한 %를 계산해요"
                                          : @"기준값과 퍼센트를 넣으면 결과를 계산해요";
              }
              double base = self.baseText.doubleValue;
              if (!self.reverseMode) {
                  double diff = self.computedResult - base;
                  return [NSString stringWithFormat:@"%@에서 %@%% %@ → %@  (%@%@)",
                          [self pretty:base], [self pretty:self.percentText.doubleValue], self.negative ? @"감소" : @"증가",
                          [self pretty:self.computedResult], diff < 0 ? @"−" : @"+", [self pretty:fabs(diff)]];
              }
              double target = self.resultText.doubleValue;
              double diff = target - base;
              return [NSString stringWithFormat:@"%@ → %@ 이 되려면 %@%% %@  (%@%@)",
                      [self pretty:base], [self pretty:target], [self pretty:self.computedPercent],
                      self.negative ? @"감소" : @"증가", diff < 0 ? @"−" : @"+", [self pretty:fabs(diff)]];
          }

          #pragma mark - 모드 전환

          // reverse 모드에서 forward 로 (계산된 %를 입력값으로 가져옴)
          - (void)switchToForward {
              if (!self.reverseMode) return;
              if (self.hasComputed) [self.percentText setString:[self rawString:self.computedPercent]];
              self.reverseMode = NO;
          }

          // forward 모드에서 reverse 로 (계산된 결과를 입력값으로 가져옴)
          - (void)switchToReverse {
              if (self.reverseMode) return;
              if (self.hasComputed) [self.resultText setString:[self rawString:self.computedResult]];
              self.reverseMode = YES;
          }

          #pragma mark - 입력

          - (void)tick { [self.haptic impactOccurred]; }

          - (void)boxTapped:(UITapGestureRecognizer *)g {
              [self tick];
              PCField f = (PCField)g.view.tag;
              if (f == PCFieldPercent) [self switchToForward];
              if (f == PCFieldResult) [self switchToReverse];
              self.active = f;
              [self refresh];
          }

          - (void)signTapped {
              [self tick];
              [self switchToForward];
              self.negative = !self.negative;
              [self refresh];
          }

          - (void)digitTapped:(UIButton *)sender {
              [self tick];
              NSString *d = [sender titleForState:UIControlStateNormal];
              if (self.active == PCFieldPercent) [self switchToForward];
              if (self.active == PCFieldResult) [self switchToReverse];
              NSMutableString *t = [self textFor:self.active];
              if (t.length >= kMaxLength) return;
              if ([d isEqualToString:@"."]) {
                  if ([t containsString:@"."]) return;
                  if (!t.length) [t appendString:@"0"];
              } else if ([t isEqualToString:@"0"]) {
                  [t setString:@""];
              }
              [t appendString:d];
              [self refresh];
          }

          - (void)backTapped {
              [self tick];
              NSMutableString *t = [self textFor:self.active];
              if (t.length) [t deleteCharactersInRange:NSMakeRange(t.length - 1, 1)];
              [self refresh];
          }

          // ⌫ 길게 누르기: 칸 비우기
          - (void)backLongPressed:(UILongPressGestureRecognizer *)g {
              if (g.state != UIGestureRecognizerStateBegan) return;
              [[[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleMedium] impactOccurred];
              [[self textFor:self.active] setString:@""];
              [self refresh];
          }

          - (void)applySign:(BOOL)negative {
              [self tick];
              [self switchToForward];
              self.negative = negative;
              if (self.active == PCFieldBase || self.active == PCFieldResult) self.active = PCFieldPercent;
              [self refresh];
          }

          - (void)plusTapped  { [self applySign:NO]; }
          - (void)minusTapped { [self applySign:YES]; }

          // = : 다음 입력 칸으로 이동
          - (void)equalsTapped {
              [self tick];
              PCField inputField = self.reverseMode ? PCFieldResult : PCFieldPercent;
              self.active = (self.active == PCFieldBase) ? inputField : PCFieldBase;
              [self refresh];
              UILabel *res = self.values[self.reverseMode ? PCFieldPercent : PCFieldResult];
              [UIView animateWithDuration:0.12 animations:^{ res.transform = CGAffineTransformMakeScale(1.06, 1.06); }
                               completion:^(BOOL f) { [UIView animateWithDuration:0.12 animations:^{ res.transform = CGAffineTransformIdentity; }]; }];
          }

          // ⇄ : 결과를 기준값으로, 기준값을 목표값으로 바꿔 필요한 % 계산
          - (void)swapTapped {
              [self tick];
              [self compute];
              if (!self.reverseMode) {
                  if (!self.hasComputed) return;
                  NSString *oldBase = [self.baseText copy];
                  [self.baseText setString:[self rawString:self.computedResult]];
                  [self.resultText setString:oldBase];
                  self.reverseMode = YES;
              } else {
                  NSString *oldBase = [self.baseText copy];
                  [self.baseText setString:self.resultText];
                  [self.resultText setString:oldBase];
              }
              self.active = PCFieldBase;
              [self refresh];
          }

          @end
          __EOF__
          cat > /tmp/b64 <<'__EOF__'
          iVBORw0KGgoAAAANSUhEUgAAAHgAAAB4CAIAAAC2BqGFAAAS7UlEQVR4Xu1daZQUVZa+78WWWVkL
